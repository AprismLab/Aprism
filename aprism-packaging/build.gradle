// Aprism Packaging - Gradle plugin for .aje/.abe pack assembly
// Published as an included build so example mods consume it via the plugins DSL.
// Consumes the project's `jar` output and produces Aprism pack formats.

plugins {
    id 'java-gradle-plugin'
}

group = 'com.aprism'
// The plugin version IS the loader baseline it stamps into .aje manifests
// (v26.9-Alpha.8). Keep it in step with the loader line in gradle.properties.
version = providers.gradleProperty('aprismVersion').getOrElse('v26.9-Alpha.8')

// Expose the version as the package implementation version so the plugin can
// resolve its own baseline at runtime (getImplementationVersion()).
tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'Aprism Packaging',
            'Implementation-Version': project.version
        )
    }
}

// Declared at project level (not settings level) so that a global init script
// adding repositories cannot shadow these.
repositories {
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation 'com.google.code.gson:gson:2.13.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation 'org.assertj:assertj-core:3.27.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

gradlePlugin {
    plugins {
        aprismPackaging {
            id = 'com.aprism.packaging'
            implementationClass = 'com.aprism.packaging.AprismPackagingPlugin'
        }
    }
}
