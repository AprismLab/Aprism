# Aprism Loader - Gradle Properties
# Author: BlockConnect@StarsailsClover

# Aprism version (public): v<Year>.<aprism>-<stability>.<subVer>
aprismVersion = v26.0-Alpha.1
# Internal phase tracker (not shown in public version strings)
aprismPhase = Phase0
aprismGroup = com.aprism

# Minecraft target
minecraftEdition = JE
minecraftVersion = 1.21.4

# Java target (Java 21 for 1.21.x; Java 25 for 26.x)
javaVersion = 21

# Gradle / JVM settings
org.gradle.jvmargs = -Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true
