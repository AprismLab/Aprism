plugins {
    id 'java-library'
    id 'com.aprism.packaging'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net' }
}

// Compile-time Minecraft stubs: the Mixin annotation processor validates the
// @Mixin target at compile time, and this example must compile without a real
// Minecraft on the classpath. The stubs mirror the loader-core test fixtures
// and are NEVER packaged (compileOnly source, not part of the .aje).
sourceSets.main.java.srcDir '../mc-stubs'

dependencies {
    compileOnly project(':aprism-api')
    compileOnly('net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7') {
        // Mixin's AP is compile-time only tooling; the fat agent ships Mixin.
        exclude group: 'com.google.guava'
    }
    annotationProcessor('net.fabricmc:sponge-mixin:0.16.5+mixin.0.8.7')
}

aprismPackaging {
    manifestFile = 'aprism.manifest.json'
    aprismBaseline = 'v26.8'
}