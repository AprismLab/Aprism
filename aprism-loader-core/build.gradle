// Aprism Loader Core - javaagent + ClassFileTransformer + classloader
// The JE Aprism Native foundation

plugins {
    id 'java-library'
    alias(libs.plugins.shadow)
}

dependencies {
    api project(':aprism-api')
    api project(':aprism-manifest')
    api libs.mixin
    api libs.mixinextras
    api libs.bundles.asm

    testImplementation libs.bundles.testing
}

// The loader core is packaged as a javaagent jar
jar {
    manifest {
        attributes(
            'Premain-Class': 'com.aprism.loader.AprismAgent',
            'Agent-Class': 'com.aprism.loader.AprismAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Implementation-Version': project.version
        )
    }
}

// Fat agent jar: self-contained javaagent with all runtime dependencies
// shaded and relocated to avoid clashes with the Minecraft classpath.
// com.aprism.api and the agent entrypoints are NOT relocated (public API).
shadowJar {
    // v26.9-Alpha.8: the fabric-host variant is a DISTINCT artifact so a host
    // integration can never pick up the native-layout jar by mistake. The
    // native layout keeps org.objectweb.asm unrelocated (Mixin's ASM-version
    // detection requires it); the fabric-host layout relocates it because the
    // Fabric host already ships ASM and Fabric Loader's verifyClasspath aborts
    // on the duplicate package.
    def fabricHost = project.findProperty('fabricVariant')
    archiveFileName = fabricHost
            ? "Aprism-${project.version}-${project.minecraftEdition}-${project.minecraftVersion}-fabric-host.jar"
            : "Aprism-${project.version}-${project.minecraftEdition}-${project.minecraftVersion}.jar"
    manifest {
        attributes(
            'Premain-Class': 'com.aprism.loader.AprismAgent',
            'Agent-Class': 'com.aprism.loader.AprismAgent',
            'Can-Redefine-Classes': 'true',
            'Can-Retransform-Classes': 'true',
            'Implementation-Version': project.version
        )
    }
    relocate 'com.google.gson', 'aprism.libs.gson'
    // Fabric-host variant (-PfabricVariant=true): host provides ASM and owns
    // Mixin there, so relocate ASM and drop our Mixin classes/services.
    // GitHub@NDBlockConnect | BlockConnect@StarsailsClover
    if (project.findProperty('fabricVariant')) {
        relocate 'org.objectweb.asm', 'aprism.libs.asm'
        exclude 'org/spongepowered/**'
        exclude 'META-INF/services/org.spongepowered.asm.service.*'
    }
    // ASM is deliberately NOT relocated: SpongePowered Mixin detects the ASM
    // version via org.objectweb.asm to decide which Java class-file versions it
    // can weave. Relocating ASM breaks that detection (it then reports ASM 9.0
    // and refuses to weave modern Java-25 Minecraft classes). Vanilla MC ships no
    // ASM, so leaving it at org.objectweb.asm causes no clash.
    // Mixin is deliberately NOT relocated: third-party mods compile their mixin
    // classes against the standard org.spongepowered.asm.mixin annotations, so
    // the Mixin framework must stay at that package for mod mixins to be
    // recognized and woven. Vanilla MC ships no Mixin, so there is no clash.
    mergeServiceFiles()
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'
    // Compile-time-only tooling from Mixin (annotation processor + ModLauncher SPI)
    exclude 'org/spongepowered/tools/**'
    exclude 'META-INF/services/javax.annotation.processing.Processor'
    exclude 'META-INF/services/cpw.mods.modlauncher.*'
    exclude 'META-INF/services/org.spongepowered.tools.obfuscation.service.IObfuscationService'

    // Inject a per-package MANIFEST section for org.objectweb.asm AFTER the jar
    // is assembled, so SpongePowered Mixin's ASM-version detection reads the REAL
    // ASM version (from the version catalog) instead of the fat jar's polluted
    // Implementation-Version (the Aprism version). Mixin derives its maximum
    // weavable class-file version from the detected ASM version; a polluted
    // version makes it cap at Java 16 and refuse modern (Java-25) classes.
    // NOTE: asmVersion is captured at CONFIGURATION time (outside the action) so
    // the closure stays configuration-cache-safe (no project/logger access inside).
    def asmVersion = libs.versions.asm.get()
    // In the fabric-host layout ASM is relocated, so the named manifest section
    // must point at the relocated package (Mixin reads it from whichever
    // package it actually loads ASM from).
    def asmSection = fabricHost ? 'aprism/libs/asm/' : 'org/objectweb/asm/'
    doLast {
        def jarFile = archiveFile.get().asFile
        def tmp = new File(jarFile.parentFile, jarFile.name + ".tmp")
        def manifest = new java.util.jar.Manifest()
        manifest.mainAttributes.putValue('Manifest-Version', '1.0')
        new java.util.jar.JarFile(jarFile).withCloseable { src ->
            // Copy main attributes from the built jar (Premain-Class, etc.)
            def srcMain = src.manifest.mainAttributes
            srcMain.keySet().each { k -> manifest.mainAttributes.putValue(k.toString(), srcMain.getValue(k)) }
            // Add the named section for the ASM package
            def asmAttrs = new java.util.jar.Attributes()
            asmAttrs.putValue('Implementation-Title', 'ASM, a very small and fast Java bytecode manipulation framework')
            asmAttrs.putValue('Implementation-Version', asmVersion)
            manifest.entries.put(asmSection, asmAttrs)
            // Rewrite the jar with the augmented manifest (skip duplicate names
            // that shadow's merged jar may contain, e.g. repeated maven metadata).
            new java.util.jar.JarOutputStream(new java.io.FileOutputStream(tmp), manifest).withCloseable { jos ->
                def seen = new HashSet<String>()
                def entries = src.entries()
                while (entries.hasMoreElements()) {
                    def e = entries.nextElement()
                    if (e.name == 'META-INF/MANIFEST.MF') continue
                    if (!seen.add(e.name)) continue
                    jos.putNextEntry(new java.util.zip.ZipEntry(e.name))
                    if (!e.isDirectory()) src.getInputStream(e).transferTo(jos)
                    jos.closeEntry()
                }
            }
        }
        jarFile.delete()
        tmp.renameTo(jarFile)
    }
}

// ---------------------------------------------------------------------------
// Agent jar layout verification (v26.9-Alpha.8)
//
// Encodes the per-host layout invariants so a regression is caught in-repo
// instead of downstream (the Fabric Loader verifyClasspath abort reported by
// Despotes Dev was a duplicate-package clash the build never checked for):
//
//   native layout       : org/objectweb/asm/** present (Mixin ASM-version
//                         detection), org/spongepowered/** present (mod mixins
//                         compile against the standard package).
//   fabric-host layout  : org/objectweb/asm/** ABSENT (relocated to
//                         aprism/libs/asm/**), org/spongepowered/** ABSENT.
//
// GitHub@NDBlockConnect | BlockConnect@StarsailsClover
// ---------------------------------------------------------------------------
tasks.register('verifyAgentJar') {
    group = 'verification'
    description = 'Asserts the fat agent jar layout matches its host variant.'
    dependsOn tasks.named('shadowJar')
    def expectedFabricHost = project.findProperty('fabricVariant') != null
    def jarProvider = tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar)
            .flatMap { it.archiveFile }
    inputs.file(jarProvider)
    doLast {
        def jarFile = jarProvider.get().asFile
        def names = []
        new java.util.jar.JarFile(jarFile).withCloseable { jar ->
            def entries = jar.entries()
            while (entries.hasMoreElements()) {
                names << entries.nextElement().name
            }
        }
        def hasAsm = names.any { it.startsWith('org/objectweb/asm/') }
        def hasRelocatedAsm = names.any { it.startsWith('aprism/libs/asm/') }
        def hasMixin = names.any { it.startsWith('org/spongepowered/') }
        def problems = []
        if (expectedFabricHost) {
            if (hasAsm) {
                problems << 'fabric-host jar must NOT ship org/objectweb/asm/** (host provides ASM; duplicates abort Fabric verifyClasspath)'
            }
            if (!hasRelocatedAsm) {
                problems << 'fabric-host jar must ship the relocated aprism/libs/asm/** classes'
            }
            if (hasMixin) {
                problems << 'fabric-host jar must NOT ship org/spongepowered/** (the host owns Mixin)'
            }
        } else {
            if (!hasAsm) {
                problems << 'native jar must ship org/objectweb/asm/** (Mixin ASM-version detection depends on it)'
            }
            if (!hasMixin) {
                problems << 'native jar must ship org/spongepowered/** (mods compile mixins against it)'
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Agent jar layout verification failed for ${jarFile.name}:\n  - "
                    + problems.join('\n  - '))
        }
        logger.lifecycle('Agent jar layout verified: {} (fabricHost={}, asm={}, relocatedAsm={}, mixin={})',
                jarFile.name, expectedFabricHost, hasAsm, hasRelocatedAsm, hasMixin)
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyAgentJar')
}
